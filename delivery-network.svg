<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="mapTitle mapDesc">
<title id="mapTitle">Studio TesoroMilano — Italian document pickup network</title>
<desc id="mapDesc">Animated line map of Italy: Milan as the service hub, Venice and Verona as existing appointment-based routes, and Florence, Rome, Naples, Sicily and Sardinia marked as planned expansion locations. Locations are illustrative, not confirmed pickup desks.</desc>
<defs>
 <radialGradient id="night"><stop offset="0" stop-color="#27495a"/><stop offset=".75" stop-color="#142b39"/><stop offset="1" stop-color="#0c1c2b"/></radialGradient>
 <linearGradient id="country"><stop stop-color="#214253"/><stop offset="1" stop-color="#173345"/></linearGradient>
 <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
 .country{fill:url(#country);stroke:#9bb0af;stroke-width:1.7;stroke-linejoin:round;opacity:.93} .country-ghost{fill:none;stroke:#8fa6a3;stroke-width:6;opacity:.06;filter:url(#glow)}
 .network-route{fill:none;stroke-linecap:round}.network-route.live{stroke:#e7c68d;stroke-width:1.65;opacity:.82}.network-route.future{stroke:#71969a;stroke-width:1.35;stroke-dasharray:3 9;opacity:.5}
 .network-trail{fill:none;stroke:#fff5d6;stroke-width:1.9;stroke-dasharray:2 15;animation:flow 9s linear infinite;opacity:.82}
 .route-spark{fill:#ffe6a8;filter:url(#glow)}
 .pin-core{fill:#f5d8a2;stroke:#faedcf;stroke-width:1.3}.pin-halo{fill:#eacb8e;opacity:.08;stroke:#f4d9a8;stroke-width:1;animation:breathe 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .pin-name{font:600 15px 'DM Sans',Arial,sans-serif;fill:#f7f0e2;paint-order:stroke;stroke:#0f2837;stroke-width:3;stroke-linejoin:round}
 .city-en{font-size:10px;fill:#b9c9c9;stroke:none}
 .network-pin.planned .pin-core{fill:#9faeb0;stroke:#b9c7c3} .network-pin.planned .pin-halo{stroke:#a8b9b8}.network-pin.planned .pin-name{fill:#d5dddd}
 .network-pin.base .pin-core{fill:#fff5ce;stroke:#fff6cc;stroke-width:2}.network-pin.base .pin-halo{opacity:.19}.network-pin.base .pin-name{fill:#f9db9c;font-weight:800}
 .pin-star{stroke:#f5d8a2;stroke-width:.85;opacity:.9;animation:twinkle 2.7s ease-in-out infinite}
 .milan-halo{fill:none;stroke:#f4d6a0;stroke-width:1;opacity:.16;animation:expand 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
 .sky-star{fill:#e7d2a5;opacity:.3;animation:twinkle 5s ease-in-out infinite}.sky-star-1{animation-delay:1s}.sky-star-2{animation-delay:2.2s}.sky-star-3{animation-delay:3.5s}
 .bottom-label{font:600 11px Arial,sans-serif;fill:#b7c8c7;letter-spacing:2px} .upper-label{font:600 12px Arial,sans-serif;fill:#e2c497;letter-spacing:3px}
 @keyframes flow{to{stroke-dashoffset:-220}}@keyframes twinkle{50%{opacity:1}}@keyframes breathe{50%{transform:scale(1.5);opacity:.2}}@keyframes expand{to{transform:scale(1.7);opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.route-spark{display:none}}
</style>
<rect width="900" height="620" rx="24" fill="url(#night)"/>
<g><circle class="sky-star sky-star-0" cx="99" cy="93" r="1.2"/><circle class="sky-star sky-star-1" cx="780" cy="83" r="1.5"/><circle class="sky-star sky-star-2" cx="802" cy="210" r="1.1"/><circle class="sky-star sky-star-3" cx="770" cy="350" r="1.1"/><circle class="sky-star sky-star-0" cx="58" cy="300" r="1.8"/><circle class="sky-star sky-star-1" cx="127" cy="520" r="1"/><circle class="sky-star sky-star-2" cx="740" cy="555" r="1.1"/><circle class="sky-star sky-star-3" cx="365" cy="28" r="1"/><circle class="sky-star sky-star-0" cx="645" cy="78" r="1"/><circle class="sky-star sky-star-1" cx="470" cy="556" r="1.2"/><circle class="sky-star sky-star-2" cx="80" cy="411" r="1.1"/><circle class="sky-star sky-star-3" cx="710" cy="470" r="1.1"/><circle class="sky-star sky-star-0" cx="850" cy="303" r="1.3"/></g>
<text x="52" y="42" class="upper-label">STUDIO TESOROMILANO  ·  ITALIA</text>
